# MCP-сервер `mydon-core` для Codex CLI — пара к `.mcp.json` (Claude Code).
#
# Оба клиента запускают ОДИН И ТОТ ЖЕ собранный сервер `apps/mcp/dist/server.js`
# (волна A1). Разные только форматы конфига: у Claude Code JSON с таблицей
# значений, у Codex — TOML со списком ИМЁН переменных.
#
# Три условия, без которых сервер не поднимется:
#   1. Пакет собран: `pnpm --filter "@mydon/mcp..." build`. Многоточие в фильтре
#      обязательно — оно собирает и зависимости; без него `dist/server.js` падает
#      с `MODULE_NOT_FOUND`. `dist/` в `.gitignore`, поэтому на свежем клоне
#      файла нет.
#   2. В окружении терминала, ИЗ КОТОРОГО запускается Codex, задан
#      `SERVICE_TOKEN`. `env_vars` не задаёт значения — он перечисляет имена,
#      которые Codex наследует из своего процесса. Без токена сервер честно
#      падает на старте с объяснением, а не 401 на первом запросе.
#   3. Каталог репозитория доверен в Codex. Слой `repo` (`.codex/config.toml`)
#      загружается, но ОТКЛЮЧАЕТСЯ для недоверенного каталога — конфиг будет
#      прочитан и молча не применён.
#
# `CORE_API_URL` и `OWNER_ACTION_TOKEN` необязательны: адрес Core по умолчанию
# `http://127.0.0.1:3001` (тот же порт, что открывает SSH-туннель), а без
# owner-токена личный контур придёт недосчитанным — это штатное поведение.
#
# Значений токенов здесь нет и быть не должно. Подробности — `docs/MCP.md`.

[mcp_servers.mydon-core]
command = "node"
args = ["apps/mcp/dist/server.js"]
env_vars = [
    "CORE_API_URL",
    "SERVICE_TOKEN",
    "OWNER_ACTION_TOKEN",
]
