# agents/_template/config.yaml — шаблон конфигурации агента
name: template
business: shared       # vendhub | globerent | shared
status: draft          # active | paused | draft | deprecated
description: Краткое описание роли.

# Паспорт/роль (Карточка агента)
version: 0.1.0
mission: Одна задача агента — узко (правится в Карточке).
non_goals:
  - Чего агент НЕ делает (границы)
changelog:
  - "0.1.0 — скелет"

# Расписание (cron, Asia/Tashkent). Пусто = только по событию/маршрутизации.
schedule: []
# Пример:
# schedule:
#   - cron: "0 8 * * *"
#     skill: monitor-stock

autonomy_default: T0   # минимальный тир; см. engine/autonomy.yaml
break_glass: []          # аварийные op (actionType) — всегда HITL+аудит, см. §4.5

# Страницы KB, которые агент подгружает в контекст (не всё сразу — только нужное)
kb_pages: []

# Скиллы агента (файлы в skills/)
skills: []

# Хуки прогона (волна R). pre_run проверяется перед навыком, первый провал = пропуск с причиной
# в журнале (/flows). Неизвестный kind БЛОКИРУЕТ навык — не угадываем. Проверяются только у
# active-агента и только на cron-прогоне (preRunApplies, runner.ts): ручной запуск с деки и задача
# с checkpoint идут мимо. Форма — snake_case как здесь; рантайм и панель читают и camelCase.
#
# ПРАВИЛО РАССТАНОВКИ (ревизия 07.09.2026) — по нему, а не по вкусу:
#   quiet_hours  — у КАЖДОГО агента с непустым schedule. Одно окно на всех: 23:00–07:00 Ташкент —
#                  сон владельца. Ближайшие расписания — 19:00 (evening-standup) и 08:00 (monitor-stock,
#                  scan-tenders) — остаются с запасом ≥1 ч с обеих сторон; ни один cron в окно не
#                  попадает (kb-review сдвинут с 00:00 на 07:30 ради этого). Не «22:00», чтобы
#                  результат, поданный в 22:xx, не считался ночным.
#   source_fresh — только если навыки агента ПО РАСПИСАНИЮ читают из Core данные, которые приносит
#                  снаружи журналируемый монитор system/<name> (Р-3 волны R): vendhub-ops и vendhub-ceo
#                  ← system/ourvend:sync (продажи → простой автоматов), market-analyst ← system/fx:refresh
#                  (курсы ЦБ). max_age_hours = два периода cron монитора: один пропущенный тик — не
#                  тревога, два — источник стоит. Хук общий на все навыки агента — цена ложного
#                  срабатывания (пропущенный parts-audit при стоящем синке) записана в паспорте.
#                  НЕ ставится: chief-of-staff (сквозной дайджест не вешается на один доменный
#                  коллектор; свежесть источников — /apps/health), mydon-finance и globerent-*
#                  (реестр GLOBERENT — внутренние данные, globerent:monitor читает только Core),
#                  knowledge-curator (t.me читается вживую, поставщика в журнале нет), coach-agent
#                  (журнал прогонов — внутренний). Монитор выключен или ни разу не отработал —
#                  хук блокирует (fail closed), причина видна в /flows.
#   coach_lite   — post_run: правила по серии прогонов + один запрос к журналу, БЕЗ LLM (hooks.ts).
#                  По умолчанию не ставим — включает владелец.
# Доставка в уже заведённые карточки — node tools/apply-passport-fields.mjs (seed существующих не трогает).
# hooks:
#   pre_run:
#     - kind: source_fresh          # источник обновлялся не позже N часов (executed-прогон из журнала)
#       run: system/ourvend:sync
#       max_age_hours: 6
#     - kind: quiet_hours           # не запускать ночью (Asia/Tashkent); ручной запуск с деки проходит
#       from: "23:00"
#       to: "07:00"
#   post_run:
#     - kind: coach_lite            # заметка по серии прогонов (3 llm-сбоя, 5 тихих, 3 предложения, 2 сбоя)

secrets: []              # ссылки на секреты (имена env/secrets.json), не значения — см. §4.4

# Маршрутизация модели (NeoMind): простое локально, сложное в облако
# ВНИМАНИЕ (04.09.2026): поле рантаймом НЕ читается — модель задаёт LLM_MODEL/LLM_FALLBACK_MODELS,
# усилие — `model-effort` во frontmatter llm-навыка. Оставлено как заметка о замысле.
model_routing:
  simple: "ollama/qwen2.5:14b"
  complex: "claude-p"
# CLOUD-2: явный дневной потолок трат (safe-default в executor — этот делает его явным/тюнимым)
budget:
  per_day_usd: 3.0
  on_exceeded: pause
