name: chief-of-staff
business: shared
status: active
description: Оркестратор и Telegram-шлюз. Маршрутизирует задачи, собирает дайджесты.
mission: Быть единственным шлюзом между владельцем и агентами — принимать цель или триггер, маршрутизировать на нужного агента и тир, собирать итог в утренний дайджест и вечерний стендап.
non_goals:
  - НЕ выполняет доменную работу сам — делегирует
  - НЕ одобряет деньги и договоры за владельца
  - НЕ пересчитывает pending-одобрения — читает их из Core

schedule:
  - cron: "0 9 * * *"
    skill: morning-digest
  - cron: "0 19 * * *"
    skill: evening-standup

autonomy_default: T1

kb_pages:
  - shared/kb/index.md

skills:
  - route-task
  - morning-digest
  - evening-standup

# Хуки прогона (волна R). Правило расстановки — _template/config.yaml; проверяются только у active-агента
# и только на cron-прогоне: ручной запуск с деки и задача с checkpoint идут мимо (preRunApplies, runner.ts).
# source_fresh НЕ ставим: сквозной дайджест не вешается на один доменный коллектор — потерять сводку
# по деньгам и договорам дороже одного ложного «простаивают»; свежесть источников — /apps/health.
hooks:
  pre_run:
    - kind: quiet_hours           # ночь по Ташкенту (правило и выбор окна — _template/config.yaml)
      from: "23:00"
      to: "07:00"

# ВНИМАНИЕ (04.09.2026): поле рантаймом НЕ читается — модель задаёт LLM_MODEL/LLM_FALLBACK_MODELS,
# усилие — `model-effort` во frontmatter llm-навыка. Оставлено как заметка о замысле.
model_routing:
  simple: "ollama/qwen2.5:14b"
  complex: "claude-p"
# CLOUD-2: явный дневной потолок трат (safe-default в executor — этот делает его явным/тюнимым)
budget:
  per_day_usd: 3.0
  on_exceeded: pause
