name: globerent-ceo
business: globerent
status: paused
description: Директор предприятия GLOBERENT (дистрибуция HELI) — единое окно, сводка, риск дебиторки, эскалация.
mission: Держать единое окно по GLOBERENT — ежедневная сводка по продажам, сервису и риску дебиторки, проактивный отлов рисков и эскалация владельцу, не дублируя chief-of-staff.
non_goals:
  - НЕ решает КП, письма контрагентам и цены — только кнопка владельцу (T3)
  - НЕ дублирует дайджест chief-of-staff
  - НЕ работает с личным контуром владельца

schedule:
  - cron: "0 18 * * *"      # ежедневная сводка по бизнесу
    skill: business-brief

autonomy_default: T1        # сводит и докладывает; КП/договоры/деньги — эскалация владельцу

kb_pages:
  - shared/kb/globerent/clients.md
  - shared/kb/globerent/faq.md

skills:
  - business-brief

# Хуки прогона (волна R). Правило расстановки — _template/config.yaml; проверяются только у active-агента
# и только на cron-прогоне: ручной запуск с деки и задача с checkpoint идут мимо (preRunApplies, runner.ts).
# source_fresh НЕ ставим: сводка строится из реестра GLOBERENT (внутренние данные; globerent:monitor читает только Core).
hooks:
  pre_run:
    - kind: quiet_hours           # ночь по Ташкенту (правило и выбор окна — _template/config.yaml)
      from: "23:00"
      to: "07:00"

# ВНИМАНИЕ (04.09.2026): поле рантаймом НЕ читается — модель задаёт LLM_MODEL/LLM_FALLBACK_MODELS,
# усилие — `model-effort` во frontmatter llm-навыка. Оставлено как заметка о замысле.
model_routing:
  simple: "ollama/qwen2.5:14b"
  complex: "claude-p"
# CLOUD-2: явный дневной потолок трат (safe-default в executor — этот делает его явным/тюнимым)
budget:
  per_day_usd: 3.0
  on_exceeded: pause
