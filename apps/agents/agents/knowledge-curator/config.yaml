name: knowledge-curator
business: shared
status: paused
description: Поддерживает базу знаний актуальной. Аудит и предложение правок.
mission: Держать базу знаний актуальной — аудит страниц KB, предложения правок диффом, дайджест идей из каналов владельца; не выдумывать факты и не переписывать тихо.
non_goals:
  - НЕ переписывает KB тихо — только diff через согласование
  - НЕ выдумывает факты — помечает «требует подтверждения»
  - НЕ трогает ROLE.md, config.yaml и код

schedule:
  - cron: "30 7 */7 * *" # было 00:00 — попадало в quiet_hours 23:00–07:00 (ревизия 07.09.2026)
    skill: kb-review
  - cron: "0 9 * * 1" # еженедельно, понедельник утром — дайджест идей из каналов
    skill: scan-ideas

autonomy_default: T2

kb_pages:
  - shared/kb/index.md

# Публичные Telegram-каналы идей владельца — навык scan-ideas читает превью
# (t.me/s/<канал>) и приносит дайджест «что перенять». Только чтение.
idea_channels:
  - promtjam

skills:
  - kb-review
  - scan-ideas
  - assess-ideas

# Хуки прогона (волна R). Правило расстановки — _template/config.yaml; проверяются только у active-агента
# и только на cron-прогоне: ручной запуск с деки и задача с checkpoint идут мимо (preRunApplies, runner.ts).
# source_fresh НЕ ставим: scan-ideas читает t.me вживую, журналируемого поставщика нет.
# Ради этого окна kb-review сдвинут с 00:00 на 07:30 — иначе хук блокировал бы собственное расписание.
hooks:
  pre_run:
    - kind: quiet_hours           # ночь по Ташкенту (правило и выбор окна — _template/config.yaml)
      from: "23:00"
      to: "07:00"

# ВНИМАНИЕ (04.09.2026): поле рантаймом НЕ читается — модель задаёт LLM_MODEL/LLM_FALLBACK_MODELS,
# усилие — `model-effort` во frontmatter llm-навыка. Оставлено как заметка о замысле.
model_routing:
  simple: "ollama/qwen2.5:14b"
  complex: "claude-p"
# CLOUD-2: явный дневной потолок трат (safe-default в executor — этот делает его явным/тюнимым)
budget:
  per_day_usd: 3.0
  on_exceeded: pause
