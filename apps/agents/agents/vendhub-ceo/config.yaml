name: vendhub-ceo
business: vendhub
status: paused
description: Директор предприятия VendHub — единое окно, сводка, эскалация владельцу.
mission: Держать единое окно по VendHub — общая картина парка, приоритеты, ежедневная сводка и эскалация рисков владельцу; не делать операционную работу руками и не дублировать chief-of-staff.
non_goals:
  - НЕ решает деньги, закупки, договоры — эскалация владельцу (T3/T4)
  - НЕ делает операционную работу руками (это vendhub-ops и люди)
  - НЕ дублирует дайджест chief-of-staff

schedule:
  - cron: "0 18 * * *"      # ежедневная сводка по бизнесу (перед вечерним стендапом холдинга)
    skill: business-brief

autonomy_default: T1        # сводит и докладывает; деньги/договоры — эскалация владельцу

kb_pages:
  - shared/kb/vendhub/sop.md

skills:
  - business-brief

# Хуки прогона (волна R). Правило расстановки — _template/config.yaml; проверяются только у active-агента
# и только на cron-прогоне: ручной запуск с деки и задача с checkpoint идут мимо (preRunApplies, runner.ts).
hooks:
  pre_run:
    - kind: source_fresh          # business-brief — сводка по парку из продаж OurVend (briefing Core);
      run: system/ourvend:sync    # синк каждые 3 ч (OURVEND_SYNC_CRON), 6 ч = два тика
      max_age_hours: 6
    - kind: quiet_hours           # ночь по Ташкенту (правило и выбор окна — _template/config.yaml)
      from: "23:00"
      to: "07:00"

# Сводка строится из данных БД (локально) → ollama; веб не нужен.
# ВНИМАНИЕ (04.09.2026): поле рантаймом НЕ читается — модель задаёт LLM_MODEL/LLM_FALLBACK_MODELS,
# усилие — `model-effort` во frontmatter llm-навыка. Оставлено как заметка о замысле.
model_routing:
  simple: "ollama/qwen2.5:14b"
  complex: "claude-p"
# CLOUD-2: явный дневной потолок трат (safe-default в executor — этот делает его явным/тюнимым)
budget:
  per_day_usd: 3.0
  on_exceeded: pause
