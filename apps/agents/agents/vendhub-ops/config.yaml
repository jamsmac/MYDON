name: vendhub-ops
business: vendhub
status: active
description: Мониторинг 31 автомата, деплеция, заявки, маршрут.

schedule:
  - cron: "0 8 * * *"
    skill: monitor-stock
  # Аудит узлов — раз в неделю, понедельник 08:30: очередь «Наклеить номер»,
  # неизвестно где, без тары, зависшая мойка (спека vendhub-parts, У3).
  - cron: "30 8 * * 1"
    skill: parts-audit
  # быстрый прогон */30 убран до появления телеметрии (на пустом KB только шумит).
  # Вернуть через Пункт управления, когда будут реальные данные остатков.

autonomy_default: T1

kb_pages:
  - shared/kb/vendhub/machines-map.md
  - shared/kb/vendhub/thresholds.md
  - shared/kb/vendhub/sop.md

skills:
  - monitor-stock
  - parts-audit

# Хуки прогона (волна R). Правило расстановки — _template/config.yaml; проверяются только у active-агента
# и только на cron-прогоне: ручной запуск с деки и задача с checkpoint идут мимо (preRunApplies, runner.ts).
hooks:
  pre_run:
    - kind: source_fresh          # monitor-stock считает простой по продажам OurVend — на протухшем синке
      run: system/ourvend:sync    # все автоматы «простаивают». Синк каждые 3 ч, 6 ч = два тика.
      max_age_hours: 6            # Гейтит и parts-audit: цена — одна пропущенная сверка узлов в понедельник.
    - kind: quiet_hours           # ночь по Ташкенту (правило и выбор окна — _template/config.yaml)
      from: "23:00"
      to: "07:00"

# ВНИМАНИЕ (04.09.2026): поле рантаймом НЕ читается — модель задаёт LLM_MODEL/LLM_FALLBACK_MODELS,
# усилие — `model-effort` во frontmatter llm-навыка. Оставлено как заметка о замысле.
model_routing:
  simple: "ollama/qwen2.5:14b"
  complex: "claude-p"
version: 1.0.0
mission: Следить за остатками 31 автомата, считать деплецию и дни-до-нуля, формировать заявки на пополнение и маршрут — докладывать, физически наружу не действовать.
non_goals:
  - НЕ закупает товар (закупки — это люди/Бехруз)
  - НЕ выезжает и не пополняет автоматы физически (это Рустам на Damas)
  - НЕ принимает стратегические решения по сети (это vendhub-ceo)
  - НЕ трогает GLOBERENT — только VendHub
changelog:
  - 1.0.0 — заполнены mission/non_goals через Карточку агента
# CLOUD-2: явный дневной потолок трат (safe-default в executor — этот делает его явным/тюнимым)
budget:
  per_day_usd: 3.0
  on_exceeded: pause
